server:
  port: 8082

spring:
  application:
    name: PatientIntakeService
  datasource:
    url: jdbc:postgresql://localhost:5432/clinic_management_patientintake_service
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

services:
  doctor-schedule:
    base-url: http://localhost:8081/api/v1/schedules
  patient-intake:
    base-url: http://localhost:8082/api/v1/queue
  clinical-consultation:
    base-url: http://localhost:8083/api/v1/clinical/encounters
  ai-gateway:
    base-url: http://localhost:8008

vietqr:
  bank-id: ${VIETQR_BANK_ID:VCB}
  account-no: ${VIETQR_ACCOUNT_NO:1040466448}
  account-name: ${VIETQR_ACCOUNT_NAME:TRAN NGO VINH PHUC}
  template: ${VIETQR_TEMPLATE:compact2}
  deposit-amount: ${VIETQR_DEPOSIT_AMOUNT:2000}
  hold-minutes: ${VIETQR_HOLD_MINUTES:15}


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html